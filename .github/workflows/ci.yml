name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public Sanity identifiers (already exposed in cdn.sanity.io image URLs); no token needed.
      NEXT_PUBLIC_SANITY_PROJECT_ID: 4y37obzm
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm run build
